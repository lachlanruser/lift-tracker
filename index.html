<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lift Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shared hatch for "0 days" in the month view (both figures reference it). -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
        <rect class="hatch-bg" width="6" height="6"/>
        <line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/>
      </pattern>
      <!-- Red dots for planned muscles; transparent between dots so the colour underneath shows. -->
      <pattern id="plan-dots" patternUnits="userSpaceOnUse" width="8" height="8">
        <circle class="plan-dot" cx="2" cy="2" r="1.15"/>
        <circle class="plan-dot" cx="6" cy="6" r="1.15"/>
      </pattern>
    </defs>
  </svg>

  <main class="app" id="app">
    <header class="topbar">
      <h1>Lift Tracker</h1>
      <div class="mode-toggle" role="group" aria-label="View">
        <button id="mode-week" type="button" aria-pressed="true">Week</button>
        <button id="mode-month" type="button" aria-pressed="false">Month</button>
        <button id="mode-plan" type="button" aria-pressed="false">Plan</button>
      </div>
    </header>

    <nav class="week-nav" aria-label="Period">
      <button id="prev-week" class="nav-btn" type="button" aria-label="Previous week">&#8249;</button>
      <div class="week-info">
        <div id="week-label" class="week-label" aria-live="polite"></div>
        <div id="week-sub" class="week-sub"></div>
      </div>
      <button id="next-week" class="nav-btn" type="button" aria-label="Next week">&#8250;</button>
    </nav>

    <div id="day-strip" class="day-strip" role="group" aria-label="Day to log"></div>

    <section class="stage" id="stage">
      <figure class="figure" id="figure-front">
        <figcaption>Front</figcaption>
      </figure>
      <figure class="figure" id="figure-back">
        <figcaption>Back</figcaption>
      </figure>
      <div id="muscle-label" class="muscle-label" role="status" hidden></div>
    </section>

    <ul class="legend" id="legend-week">
      <li><span class="swatch swatch-none"></span>Not trained this week</li>
      <li><span class="swatch swatch-week"></span>Trained other days this week</li>
      <li><span class="swatch swatch-day"></span><span id="legend-day">Logged today</span></li>
      <li id="legend-week-plan" hidden><span class="swatch swatch-plan"></span><span id="legend-week-plan-text">Planned</span></li>
    </ul>

    <ul class="legend" id="legend-plan" hidden>
      <li><span class="swatch swatch-plan"></span><span id="legend-plan-text">Planned</span></li>
    </ul>

    <div class="legend-month" id="legend-month" hidden>
      <div class="legend-title">Days trained in these 30 days</div>
      <ul class="legend">
        <li><span class="swatch swatch-band0"></span>0</li>
        <li><span class="swatch swatch-band1"></span>1</li>
        <li><span class="swatch swatch-band2"></span>2&ndash;3</li>
        <li><span class="swatch swatch-band3"></span>4&ndash;5</li>
        <li><span class="swatch swatch-band4"></span>6&ndash;8</li>
        <li><span class="swatch swatch-band5"></span>9+</li>
      </ul>
    </div>

    <section class="backup" id="backup" aria-labelledby="backup-title">
      <h2 id="backup-title">Backup</h2>
      <p id="backup-status" class="backup-status" aria-live="polite"></p>
      <div class="backup-actions">
        <button id="backup-auto" class="pill-btn" type="button" hidden>Set up auto-backup</button>
        <button id="backup-export" class="pill-btn" type="button">Export</button>
        <button id="backup-import" class="pill-btn" type="button">Import</button>
        <input id="backup-file" type="file" accept=".json,application/json" hidden>
      </div>
    </section>
  </main>

  <script src="js/muscles.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/store.js"></script>
  <script src="js/figure.js"></script>
  <script src="js/app.js"></script>
  <script src="js/backup-ui.js"></script>
</body>
</html>
